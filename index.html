<!DOCTYPE html>
<html>
<head>

<title>Travel Booking Website</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand">
✈️ TravelGo
</a>


<button class="btn btn-light">
Login
</button>

</div>

</nav>




<!-- Home Banner -->

<section class="hero">

<div class="container text-center text-white">

<h1>
Explore The World 🌎
</h1>

<p>
Book your dream destination and hotels easily
</p>


<input type="text"
id="search"
class="form-control w-50 mx-auto"
placeholder="Search Destination"
onkeyup="searchPlace()">


</div>

</section>





<!-- Destinations -->


<div class="container mt-5">


<h2 class="text-center">
Popular Destinations
</h2>



<div class="row mt-4" id="places">



<div class="col-md-4 place">


<div class="card shadow">


<img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34"
class="card-img-top">


<div class="card-body">

<h4>Paris</h4>

<p>
France - Romantic city with beautiful places.
</p>


<button class="btn btn-primary">
Book Now
</button>


</div>

</div>


</div>





<div class="col-md-4 place">


<div class="card shadow">


<img src="https://images.unsplash.com/photo-1510414842594-a61c69b5ae57"
class="card-img-top">


<div class="card-body">


<h4>Maldives</h4>

<p>
Beautiful beaches and luxury resorts.
</p>


<button class="btn btn-primary">
Book Now
</button>


</div>

</div>


</div>





<div class="col-md-4 place">


<div class="card shadow">


<img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c"
class="card-img-top">


<div class="card-body">


<h4>Dubai</h4>

<p>
Modern city with amazing attractions.
</p>


<button class="btn btn-primary">
Book Now
</button>


</div>

</div>


</div>


</div>

</div>






<!-- Hotel Booking -->


<div class="container mt-5">


<h2 class="text-center">
Hotel Booking 🏨
</h2>



<div class="card shadow p-4 mt-3">


<input class="form-control mb-3"
placeholder="Enter Name">


<input class="form-control mb-3"
placeholder="Destination">


<input type="date"
class="form-control mb-3">


<button class="btn btn-success">
Book Hotel
</button>


</div>


</div>







<!-- Image Gallery -->

<div class="container mt-5">

<h2 class="text-center mb-4">
Image Gallery 📸
</h2>


<div class="row">

<div class="col-md-4 mb-4">
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"
class="gallery">
</div>


<div class="col-md-4 mb-4">
<img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=800&q=80"
class="gallery">
</div>


<div class="col-md-4 mb-4">
<img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80"
class="gallery">
</div>


</div>

</div>


</div>


</div>








<!-- Contact Form -->


<div class="container mt-5 mb-5">


<h2 class="text-center">
Contact Us
</h2>


<div class="card shadow p-4">


<input class="form-control mb-3"
placeholder="Your Name">


<input class="form-control mb-3"
placeholder="Email">


<textarea class="form-control mb-3"
placeholder="Message"></textarea>


<button class="btn btn-primary">
Submit
</button>


</div>


</div>





<script>


function searchPlace()
{

let input =
document.getElementById("search")
.value.toLowerCase();


let cards =
document.getElementsByClassName("place");



for(let i=0;i<cards.length;i++)
{

let text =
cards[i].innerText.toLowerCase();


if(text.includes(input))
{
cards[i].style.display="block";
}

else
{
cards[i].style.display="none";
}


}

}




</script>



</body>
</html>
